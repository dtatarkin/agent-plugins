[files]
# The files `openspec update` generates, and the archive of closed changes.
# And the lockfile, which is not text anyone wrote: a hash that spells a word
# is not a typo.
extend-exclude = [
  ".claude/commands/opsx/",
  ".claude/skills/openspec-*/",
  "openspec/changes/archive/",
  "uv.lock",
]

[default.extend-words]
# The prefix of a hyphenated word, as in "mis-set".
mis = "mis"

[default.extend-identifiers]
