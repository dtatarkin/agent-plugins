schema: spec-driven

context: |
  This repository is public: every artifact, path, commit message and branch
  name in it is published. None may name anything the private-names guard's
  list holds. That list is held outside the repository; refer to it only as
  the file named by AGENT_PLUGINS_PRIVATE_NAMES, or the fallback
  ~/.config/agent-plugins/private-names, never by its entries.
  Write every artifact in English.

rules:
  design:
    - >-
      Include a "House rules" section naming each of this repository's own
      plugins whose rules the change touches (python-rules, plugin-rules,
      lint-rules, just-rules; the directories under plugins/ regenerate the
      list), and every rule the design deliberately breaks, each with its
      reason. Example: "python-rules cli.md: argv is hand-parsed, because the
      hook must run without a virtual environment." Not: "follows the house
      rules", which names nothing checkable. Write "None broken" when none
      is. This is a reminder of the Deviating section of AGENTS.md, the
      normative home.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
