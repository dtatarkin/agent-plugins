schema: spec-driven

context: |
  This repository is public: every artifact, path, commit message and branch
  name in it is published. None may name anything the private-names guard's
  list holds. That list is held outside the repository; refer to it only as
  the file named by AGENT_PLUGINS_PRIVATE_NAMES, or the fallback
  ~/.config/agent-plugins/private-names, never by its entries.
  Write every artifact in English.

rules:
  design:
    - >-
      Include a "House rules" section naming each of this repository's own
      plugins whose rules the change touches (python-rules, plugin-rules,
      lint-rules, just-rules; the directories under plugins/ regenerate the
      list), and every rule the design deliberately breaks, each with its
      reason. Example: "python-rules cli.md: argv is hand-parsed, because the
      hook must run without a virtual environment." Not: "follows the house
      rules", which names nothing checkable. Write "None broken" when none
      is. This is a reminder of the Deviating section of AGENTS.md, the
      normative home.

operations:
  archive:
    guidance:
      - >-
        Sync the change's delta specs into the main specs as part of archiving,
        before the change directory moves: an archive that skips the sync leaves
        the spec tree describing work that has already landed, and the deltas
        that would have corrected it move into `archive/` in the same step.
        Archive unsynced only on an explicit instruction given for that archive,
        and then say in the summary that the main specs were left stale.
      - >-
        The sync is not a decision to put to the user. Take it, and report what
        was done rather than asking what to do.
      - >-
        If a slot in a roadmap under openspec/roadmaps/ names the change being
        archived, set that slot to `done` and file any unbuilt remainder as a new
        slot or a follow-up, never as prose on the finished slot, in the
        archive's own commit. Find it with:
          grep -n -- '- \*\*Change:\*\* `<change>`$' openspec/roadmaps/*/roadmap.md
        A change no slot names leaves every roadmap as it is, and no change
        carries a task of its own for updating a roadmap. Normative home: the
        project-roadmaps spec, kept outside this repository; this entry is a
        reminder of it, not a second source.
      - >-
        After setting the slot, run `openspec-roadmap-reconcile` and read its
        exit: 0 is expected; 1 lists disagreements to report and propose, never
        to correct on the archive's own authority; 2 is reported and does not
        stop the archive. Normative home: the project-roadmaps spec, kept
        outside this repository; this entry is a reminder of it, not a second
        source.
      - The archive, its spec sync and its roadmap slot land as one commit. Do not push.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
