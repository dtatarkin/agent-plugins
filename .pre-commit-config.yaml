# The house lint sets this repository's signals derive: the baseline set
# (always), python (pyproject.toml and src/), markup (YAML, TOML and markdown
# files) and shell (the guard is a bash script). No infrastructure, web or data
# signal. uv.lock is tracked, so the Python set carries its lockfile hook and
# its audit, and every local hook the lockfile can pin runs through `uv run`.
#
# There is no top-level `exclude:`: it would exempt paths from the
# private-names guard too, and nothing is exempt from that. A tree a hook must
# not rewrite is excluded on that hook, or in the tool's own configuration:
# every hook that rewrites skips the files `openspec update` generates and the
# archive of closed changes, by the pattern repeated on each such entry
# (typos reads the same exclusion from _typos.toml).

# One install (`prek install` or `pre-commit install`) installs both stages:
# the guard checks staged files at pre-commit and the message at commit-msg.
default_install_hook_types: [pre-commit, commit-msg]
# With commit-msg installed, a hook whose manifest declares no stages would
# also run there and be handed the message file; keep such hooks at pre-commit.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Every staged path, whatever its type: `types: []` keeps symbolic links
      # and submodule paths, which the default `types: [file]` would drop. No
      # `files:` or `exclude:`, here or at the top level: nothing is exempt.
      # The `--` keeps a path starting with `-` from reading as an option.
      - id: check-private-names
        name: check-private-names
        entry: scripts/check-private-names --
        language: script
        types: []
      # The commit message file git hands the commit-msg stage.
      - id: check-private-names-message
        name: check-private-names (message)
        entry: scripts/check-private-names --message
        language: script
        stages: [commit-msg]
      # The self-test builds its own throwaway repository, so it takes no
      # filenames; it runs whenever the guard or the test changes.
      - id: check-private-names-selftest
        name: check-private-names (self-test)
        entry: tests/check-private-names.sh
        language: script
        files: ^(scripts/check-private-names|tests/check-private-names\.sh)$
        pass_filenames: false

  # Baseline: file hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(\.claude/commands/opsx/|\.claude/skills/openspec-[^/]+/|openspec/changes/archive/)
      - id: end-of-file-fixer
        exclude: ^(\.claude/commands/opsx/|\.claude/skills/openspec-[^/]+/|openspec/changes/archive/)
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^(\.claude/commands/opsx/|\.claude/skills/openspec-[^/]+/|openspec/changes/archive/)
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: debug-statements
      - id: detect-private-key

  # Baseline: secret scanning.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Baseline: spelling (a fixer; its exclusions live in _typos.toml).
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.0
    hooks:
      - id: typos

  # Python: lint and format.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  # Python: packaging.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.7
    hooks:
      - id: uv-lock

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "v0.27"
    hooks:
      - id: validate-pyproject

  # Python: the type-checking pair, through the lockfile, and the dependency
  # audit on demand.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: ty
        name: ty
        entry: uv run ty check src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: pip-audit
        name: pip-audit
        entry: >-
          bash -c 'uv export --no-hashes --no-emit-workspace --no-dev --quiet
          | uvx --quiet pip-audit --requirement /dev/stdin --disable-pip --no-deps --strict'
        language: system
        stages: [manual]
        always_run: true
        pass_filenames: false

  # Baseline: justfile formatting through the lockfile, which pins `just`, and
  # nix formatting by name; inert while the repository holds no justfile and no
  # nix file.
  - repo: local
    hooks:
      - id: format-justfile
        name: format justfile
        entry: bash -c 'for f in "$@"; do uv run just --fmt --unstable --justfile "$f"; done' --
        language: system
        files: (^|/)justfile$|\.just$
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        files: \.nix$

  # Markup: YAML.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  # Markup: TOML.
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        exclude: ^(\.claude/commands/opsx/|\.claude/skills/openspec-[^/]+/|openspec/changes/archive/)

  # Markup: markdown (its exclusions live in .rumdl.toml).
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.3.2
    hooks:
      - id: rumdl-check
        args: [--fix]
        exclude: ^(\.claude/commands/opsx/|\.claude/skills/openspec-[^/]+/|openspec/changes/archive/)

  # Shell.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
